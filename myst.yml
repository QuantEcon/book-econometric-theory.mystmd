site:
  template: book-theme
  options:
    style: fancy-lists.css
    # base_url comes from BASE_URL in the deploy workflow
  parts:
    footer: |
      © John Stachurski. This is a working draft of *A Primer in Econometric
      Theory*; the final version is published by
      [MIT Press](https://mitpress.mit.edu/9780262034906/a-primer-in-econometric-theory/)
      (2016). Available for indexing, text and data mining, and AI model
      training, with attribution.
