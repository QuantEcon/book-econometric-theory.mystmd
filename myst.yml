version: 1
project:
  # (i)/(a) list markers: the fork parses them (qe-v8+), book-theme renders
  # every ordered list as 1., 2., ...; this plugin + fancy-lists.css draw the
  # print markers. Copied from QuantEcon/book-dp2's mystmd/.
  plugins:
    - fancy-lists.mjs
  title: "A Primer in Econometric Theory"
  subtitle: "Working draft"
  authors:
    - name: John Stachurski
  # The LaTeX source is private: the GitHub link points at the public repo
  # the site is published from, and there is no edit link.
  github: https://github.com/QuantEcon/book-econometric-theory.mystmd
  edit_url: null
  # The working-draft PDF, built from ../et.tex and copied in by
  # scripts/publish.sh.
  downloads:
    - file: primer-econometric-theory-draft.pdf
      title: Working draft (PDF)
  bibliography:
    - references.bib
  # Book-mode numbering with Roman-numbered parts, as in print: chapter 1
  # (Introduction) stands before Part I, and the appendix is chapter 15 in
  # Part IV. Each theorem-like environment has its own counter, numbered
  # within sections (mpreamb.tex: \newtheorem{...}{...}[section]), and so do
  # exercises.
  numbering:
    book:
      enabled: true
    chapters:
      label: "Chapter %s"
    proof:
      scope: section
    exercise:
      scope: section
    # Facts are {prf:property} (MyST has no "fact" kind); show them as in print.
    # Listings and algorithms are numbered through the book in print.
    code:
      continue: true
      template: "Listing %s"
    proof:algorithm:
      continue: true
    proof:property:
      label: "Fact %s"
      template: "Fact %s"
  toc:
    - file: index.md
    - title: Front Matter
      section: frontmatter
      children:
        - file: preface.md
          title: Preface
        - file: common_symbols.md
          title: Common Symbols
    - title: Introduction
      section: chapters
      children:
        - file: ch01_introduction.md
          title: Introduction
    - title: Background
      section: parts
      children:
        - file: ch02_vector_spaces.md
          title: Vector Spaces
        - file: ch03_linear_algebra.md
          title: Linear Algebra and Matrices
        - file: ch04_probability.md
          title: Foundations of Probability
        - file: ch05_dependence.md
          title: Modeling Dependence
        - file: ch06_asymptotics.md
          title: Asymptotics
        - file: ch07_further_probability.md
          title: Further Topics in Probability
    - title: Foundations of Statistics
      section: parts
      children:
        - file: ch08_estimators.md
          title: Estimators
        - file: ch09_estimator_properties.md
          title: Properties of Estimators
        - file: ch10_intervals_tests.md
          title: Confidence Intervals and Tests
    - title: Econometric Models
      section: parts
      children:
        - file: ch11_regression.md
          title: Regression
        - file: ch12_ols.md
          title: Ordinary Least Squares
        - file: ch13_large_samples.md
          title: Large Samples and Dependence
        - file: ch14_regularization.md
          title: Regularization
    - title: Appendix
      section: parts
      children:
        - file: appendix.md
          title: Appendix
  # Generated from ../mpreamb.tex, with KaTeX substitutes where it lacks the
  # LaTeX (\mathbbm, \sc small caps, stackengine, \nobreak).
